# 週次で収集パイプラインを実行し、新規の告示があれば台帳をコミットする。
# 状態ファイル data/kanpo_state.json もリポジトリで管理し、実行の継続性を保つ。
name: weekly-update

on:
  schedule:
    # 月曜 07:24 JST = 日曜 22:24 UTC
    - cron: "24 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection pipeline
        run: PYTHONPATH=src python -m kenchiku_kokuji.run_all

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Weekly update: $(date +%F)"
            git push
          fi
